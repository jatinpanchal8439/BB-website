<!DOCTYPE html>
<html>
<head>
<style>
  .crop-container {
    width: 600px;
    height: 600px;
    overflow: hidden;
    position: relative;
    border: 1px solid red;
    display: inline-block;
  }
  .crop-img {
    width: 200%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0;
  }
  .left-crop { left: 0; object-position: left; }
  .right-crop { right: 0; object-position: right; }
</style>
</head>
<body>
  <h2>Banner 1 (Skincare? Image Left)</h2>
  <div class="crop-container">
    <img src="banner1.png" class="crop-img left-crop" />
  </div>
  <h2>Banner 2 (Ayurveda? Image Right)</h2>
  <div class="crop-container">
    <img src="banner2.png" class="crop-img right-crop" />
  </div>
</body>
</html>
